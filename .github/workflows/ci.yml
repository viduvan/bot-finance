name: ACTA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: |
          cd apps/backend
          ruff check app/ tests/

      - name: Run Ruff formatter check
        run: |
          cd apps/backend
          ruff format --check app/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acta
          POSTGRES_PASSWORD: acta_secret
          POSTGRES_DB: acta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+asyncpg://acta:acta_secret@localhost:5432/acta_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          TRADING_MODE: PAPER
        run: |
          cd apps/backend
          python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/backend/coverage.xml

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for secrets in code
        run: |
          # Simple grep for common secret patterns (no external tools needed)
          if grep -rn "password\s*=\s*['\"]" apps/backend/app/ --include="*.py" | grep -v "password_hash" | grep -v "password_min" | grep -v "def.*password" | grep -v "#" | grep -v "detail="; then
            echo "⚠️ Potential hardcoded password found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected."
